# Building the image here instead of pulling it, and running the code from
# this folder instead of from the image - for developing on it.
#
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# or in one go with ./start.sh --build.
#
# Two things, and they belong together. "build:" makes the image from this
# Dockerfile. The source mount puts this folder back over /app, so that a
# changed app.py needs a restart and not a build.
#
# Both are deliberately out of docker-compose.yml, and the mount is the more
# important of the two. That file is the one everybody else runs, and with
# ./:/app in it the code that runs is never the code that was pulled: the
# image would be overwritten by whatever happens to lie in the folder it is
# started from. It also forces everybody into a git clone for something that
# is otherwise one downloaded file. Here it costs nothing, because whoever
# uses this file has the clone by definition.
#
# The "build:" is out of there for a second reason: with it, Compose builds
# whenever the image is not already there, which is exactly the several
# minutes on an ARM NAS that the published image exists to save.
#
# It is deliberately not called docker-compose.override.yml. Compose reads a
# file of that name by itself, without being asked - which would put both of
# these back as the default for anybody who has the file lying around.
#
# The build is tagged with the name from docker-compose.yml, so a plain
# "docker compose up -d" afterwards uses what was built here. A
# "docker compose pull" fetches the published image over it again.
services:
  vorlaut:
    build: .
    volumes:
      # Added to the ./data:/data from docker-compose.yml, not instead of it.
      # /data is its own mount and this one does not reach into it.
      #
      # The baked-in voices survive this because they sit at /voices, outside
      # /app - see the Dockerfile.
      - ./:/app
