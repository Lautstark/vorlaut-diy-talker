<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>vorlaut</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#161618">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="vorlaut">

<!-- The one bare name Vite cannot resolve, because it never sees the module
     that writes it.

     backend/local.ts reaches piper by importing a pinned CDN URL at the moment
     somebody first asks for speech - see src/types/cdn.d.ts for why that stays
     a URL rather than a dependency. The browser fetches vits-web itself, and
     vits-web's bundle imports onnxruntime-web by bare name. Nothing in the
     build is in that conversation: adding onnxruntime-web to package.json
     would put a copy in node_modules that the fetched module has no way to
     reach. An import map is what a browser resolves a bare name with, so this
     is the entry, and it is the only one.

     Without it every sentence in a build comes back as "TTS failed: Failed to
     resolve module specifier 'onnxruntime-web'" and the play button beside
     each key does nothing. Neither shows up in a check that does not press
     them - e2e/build.spec.ts routes the CDN to a stand-in, deliberately, so it
     cannot see this either.

     In <head>, and last in it: Vite appends its own module script here, an
     import map has to be parsed before the first module loads, and one that
     arrives afterwards is ignored with a console error rather than an
     exception. -->
<script type="importmap">
{
  "imports": {
    "onnxruntime-web": "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.18.0/dist/esm/ort.wasm.min.js"
  }
}
</script>
</head>
<body>
<!-- Everything that was here is in src/ui/templates/ now, beside the module
     that wires it: the header, the board, the symbol picker and the settings
     sheet. main.ts mounts them before it wires anything, and the order it
     mounts them in is the order they appear.

     Absolute paths above rather than relative ones, and that is Vite's doing
     rather than a reversal: `base` is set from the environment at build time,
     so /icon.svg becomes /vorlaut/icon.svg in the published bundle and stays
     /icon.svg when `npm run dev` serves from the root. Writing "./" here would
     opt those files out of that rewriting. -->
<script type="module" src="/src/main.ts"></script>
</body>
</html>
