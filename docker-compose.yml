services:
  vorlaut:
    build: .
    image: vorlaut
    container_name: vorlaut
    ports:
      # Another port on the computer, in case something already runs there:
      #   VORLAUT_PORT=8798 docker compose up -d
      - "${VORLAUT_PORT:-8771}:8771"
      # The port the device shouts on to find this server. Fixed, whatever
      # the line above says: it is the one number both sides have to agree on
      # in advance, and the answer carries the real port.
      - "8771:8771/udp"
    environment:
      # A licensed METACOM collection lives outside the project and has to be
      # mounted. Where it sits on the computer is in .env - Compose reads that
      # by itself. Inside the container it is always at /metacom, so the same
      # setup works on a Mac and on a NAS.
      # With nothing mounted, /metacom does not hold the expected folder
      # structure - then the search runs with ARASAAC alone.
      - VORLAUT_METACOM_DIR=/metacom
      # Inside the container the interface listens on 8771; from outside the
      # NAS it is whatever was published above. Only this line can tell the
      # two apart, and without it the device would be sent to the wrong port.
      - VORLAUT_PUBLIC_PORT=${VORLAUT_PORT:-8771}
    volumes:
      # Hand in the whole project: that way layout.json, symbols/ and cache/
      # live on the NAS and survive every rebuild of the image. The Azure key
      # comes through the .env from exactly this folder - deliberately not
      # baked into the image.
      #
      # Careful: this replaces /app wholesale, image contents and all. It is
      # why the baked-in voices sit at /voices and not under /app - see the
      # Dockerfile. Whatever has to survive the mount belongs outside /app.
      - ./:/app
      # Read only - the collection is never changed. With no path set, the
      # mount points at example/ instead; the METACOM structure is missing
      # there and the integration switches itself off. Compose cannot leave a
      # mount out, hence this route.
      - ${VORLAUT_METACOM_DIR:-./example}:/metacom:ro
    # Being found from the network is the one thing a bridge network is bad
    # at: a broadcast has to be carried in by Docker's port forwarding, and
    # whether it is depends on the host. The name vorlaut.local does not get
    # in at all - multicast is not something a published port carries.
    #
    # If the device does not find the server, in this order:
    #   1. Type the address of the NAS into the setup portal. The field is
    #      there for this and beats the search. Everything else - the whole
    #      sync - works over the published port as before.
    #   2. Hand the container the host's network, and it is found like any
    #      other server on it. Then the "ports:" above no longer apply, and
    #      neither does VORLAUT_PORT: the interface sits on 8771 of the NAS.
    # network_mode: host

    # On a Synology the container otherwise runs as root, and everything it
    # creates (cache/, layout.json) belongs to root afterwards - over the
    # network share it can then no longer be edited. Find your own id over SSH
    # with "id" and enter it here, e.g. "1026:100".
    # user: "1026:100"
    restart: unless-stopped
