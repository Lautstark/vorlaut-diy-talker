services:
  vorlaut:
    # The ready-made image, built for amd64 and arm64 on every change to the
    # Dockerfile or requirements.txt. Pulling is the default because that is
    # the shorter way for everybody who only wants to run this - and on a NAS
    # with ARM it saves several minutes of building.
    #
    # Building it yourself is one file further along: docker-compose.build.yml
    # adds the "build:" back. See docs/operation.md.
    image: ghcr.io/lautstark/vorlaut:latest
    container_name: vorlaut
    ports:
      # Another port on the computer, in case something already runs there:
      #   VORLAUT_PORT=8798 docker compose up -d
      - "${VORLAUT_PORT:-8771}:8771"
      # The port the device shouts on to find this server. Fixed, whatever
      # the line above says: it is the one number both sides have to agree on
      # in advance, and the answer carries the real port.
      - "8771:8771/udp"
    environment:
      # VORLAUT_CONTENT=/data and VORLAUT_ENV_FILE=/data/.env are deliberately
      # not here: the Dockerfile sets them, so the image knows where its
      # content goes without being told. They were here once, and that alone
      # made the image unrunnable without this file - see the Dockerfile for
      # what that looked like. Setting them again here would only be a second
      # place to change them.
      #
      # A licensed METACOM collection is deliberately not set up here. It
      # lives outside all of this, it is optional, and most people have none.
      # docs/operation.md has the two lines - the mount and the variable - for
      # whoever does.
      #
      # Naming the variable here without the mount was tried and is worse: the
      # settings sheet then reports a configured folder holding nothing
      # readable and unfolds itself to say so, which is a fault message for
      # something that is not a fault. Unset, it says what is true - searching
      # ARASAAC alone.
      # Inside the container the interface listens on 8771; from outside the
      # NAS it is whatever was published above. Only this line can tell the
      # two apart, and without it the device would be sent to the wrong port.
      - VORLAUT_PUBLIC_PORT=${VORLAUT_PORT:-8771}
    volumes:
      # The whole of it: layout.json, symbols/, cache/, the spoken sentences
      # and the .env. This lives on the NAS, is covered by its backup, and
      # survives every new image. Nothing else is handed in.
      #
      # Make the folder before the first start. A missing one is either a
      # refusal to start or a folder Docker creates as root, depending on the
      # Docker - and the container is not root. See docs/operation.md.
      - ./data:/data
    # The container does not run as root - see the Dockerfile for why. What
    # that costs is this line, and there is no way around it: which id owns
    # the files on the NAS is a fact about the NAS, and the container has to
    # be told. 1000:1000 is right on an ordinary Linux and on Docker Desktop.
    # A Synology numbers differently, so put your own in - "id" over SSH says
    # what it is - into the .env next to this file:
    #
    #   VORLAUT_UID=1026
    #   VORLAUT_GID=100
    #
    # Get it wrong and the container cannot write into data/, and says so in
    # the log on the first start rather than later.
    user: "${VORLAUT_UID:-1000}:${VORLAUT_GID:-1000}"
    # Being found from the network is the one thing a bridge network is bad
    # at: a broadcast has to be carried in by Docker's port forwarding, and
    # whether it is depends on the host. The name vorlaut.local does not get
    # in at all - multicast is not something a published port carries.
    #
    # If the device does not find the server, in this order:
    #   1. Type the address of the NAS into the setup portal. The field is
    #      there for this and beats the search. Everything else - the whole
    #      sync - works over the published port as before.
    #   2. Hand the container the host's network, and it is found like any
    #      other server on it. Then the "ports:" above no longer apply, and
    #      neither does VORLAUT_PORT: the interface sits on 8771 of the NAS.
    # network_mode: host
    restart: unless-stopped
