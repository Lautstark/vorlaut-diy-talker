<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- The title is in the label table with everything else and is set by main.ts.
     What stands here is what a tab shows before any module has run, and it is
     the product's name rather than a sentence in one of two languages. -->
<title>vorlaut</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<!-- No manifest. The editor is the installable thing; this is a page somebody
     opens with a cable in their hand and closes again, and a second app icon
     for it would be a second product on a home screen. -->
<meta name="theme-color">
<!-- The same inline snippet the editor's index.html carries, and the same
     reason: a module is deferred, so a scheme read there lands after the first
     paint and the page flashes the OS's answer before correcting itself. Both
     pages read vorlaut.theme, so a reader who set the editor dark finds this
     one dark too. -->
<script>
try{var t=localStorage.getItem("vorlaut.theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}
</script>
</head>
<body>
<!-- Empty, exactly as the editor's is. main.ts builds the five steps, because
     which of them exists and what each one says depends on how far the file
     has got - and markup here would be a sixth copy of the flow that has to be
     kept in step with the one in that module. -->
<script type="module" src="/loader/src/main.ts"></script>
</body>
</html>
