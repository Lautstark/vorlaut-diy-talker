name: Firmware build
description: >
  Sets up arduino-cli with the ESP32 core and the Adafruit libraries and
  compiles the given sketches.

# Why a step of its own instead of the same text twice: CI and release have
# to use the same board setting. An image with a different partition scheme
# boots with black displays - that must not depend on whether someone keeps
# both files in sync.

inputs:
  sketches:
    description: Sketch folders, one per line.
    required: false
    default: firmware/vorlaut
  fqbn:
    description: Board setting, partition scheme included.
    required: false
    default: esp32:esp32:adafruit_feather_esp32s3_nopsram:PartitionScheme=default_8MB
  version:
    description: >
      What the build should call itself in the cable's greeting - the tag, for
      a release. Left empty everywhere else, and then version.h's own default
      stands: a build that is not a release says `dev` rather than claiming a
      number nobody cut.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # The one action here still running on Node.js 20, so this step keeps
    # warning after everything else was moved to actions on Node.js 24.
    # There is nothing to bump to: v2.0.0 is the newest release, from July
    # 2024, and the default branch declares node20 as well. Whoever comes
    # back to this because of the warning should check for a newer release
    # first rather than pinning a commit - the runner still runs node20
    # actions, it only complains.
    - uses: arduino/setup-arduino-cli@v2

    # Deliberately by hand instead of through arduino/compile-sketches: only
    # that way can --output-dir be set and the finished image collected.
    - name: ESP32 core and libraries
      shell: bash
      run: |
        arduino-cli config init --overwrite
        arduino-cli config add board_manager.additional_urls \
          https://espressif.github.io/arduino-esp32/package_esp32_index.json
        arduino-cli core update-index
        arduino-cli core install esp32:esp32
        # Two, and there used to be three: WiFiManager brought the setup
        # portal, and went with the radio. The note it carried is worth
        # keeping in spirit - this workflow went red for four runs once
        # because a sketch entered the matrix and its library did not.
        arduino-cli lib install \
          "Adafruit GFX Library" \
          "Adafruit ST7735 and ST7789 Library"
        arduino-cli core list
        arduino-cli lib list

    - name: Compile
      shell: bash
      env:
        SKETCHES: ${{ inputs.sketches }}
        FQBN: ${{ inputs.fqbn }}
        VERSION: ${{ inputs.version }}
      run: |
        # The version reaches the sketch as a macro rather than as an edit to
        # a checked-in file, so that the tag stays the only place a release is
        # named - see firmware/vorlaut/version.h. compiler.cpp.extra_flags is
        # the property to hang it on: build.extra_flags already carries the
        # board's own defines, and overriding that would take them away.
        properties=()
        if [ -n "$VERSION" ]; then
          properties+=(--build-property
                       "compiler.cpp.extra_flags=-DVORLAUT_VERSION=\"$VERSION\"")
        fi
        while IFS= read -r sketch; do
          [ -n "$sketch" ] || continue
          echo "::group::$sketch"
          arduino-cli compile \
            --fqbn "$FQBN" \
            --warnings all \
            "${properties[@]}" \
            --output-dir "build/$(basename "$sketch")" \
            "$sketch" < /dev/null
          echo "::endgroup::"
        done <<< "$SKETCHES"
        ls -lh build/*/
