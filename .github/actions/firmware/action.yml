name: Firmware übersetzen
description: >
  Richtet arduino-cli mit ESP32-Core und den Adafruit-Bibliotheken ein und
  übersetzt die angegebenen Sketche.

# Warum ein eigener Schritt und nicht zweimal derselbe Text: CI und
# Veröffentlichung müssen dieselbe Board-Einstellung benutzen. Ein Abbild mit
# einem anderen Partitionsschema bootet mit schwarzen Displays - das darf nicht
# davon abhängen, ob jemand beide Dateien nachzieht.

inputs:
  sketche:
    description: Sketch-Ordner, einer je Zeile.
    required: false
    default: firmware/mitreden
  fqbn:
    description: Board-Einstellung samt Partitionsschema.
    required: false
    default: esp32:esp32:adafruit_feather_esp32s3_nopsram:PartitionScheme=default_8MB

runs:
  using: composite
  steps:
    - uses: arduino/setup-arduino-cli@v2

    # Bewusst von Hand statt über arduino/compile-sketches: nur so lässt sich
    # --output-dir setzen und das fertige Abbild einsammeln.
    - name: ESP32-Core und Bibliotheken
      shell: bash
      run: |
        arduino-cli config init --overwrite
        arduino-cli config add board_manager.additional_urls \
          https://espressif.github.io/arduino-esp32/package_esp32_index.json
        arduino-cli core update-index
        arduino-cli core install esp32:esp32
        arduino-cli lib install \
          "Adafruit GFX Library" \
          "Adafruit ST7735 and ST7789 Library"
        arduino-cli core list
        arduino-cli lib list

    - name: Übersetzen
      shell: bash
      env:
        SKETCHE: ${{ inputs.sketche }}
        FQBN: ${{ inputs.fqbn }}
      run: |
        while IFS= read -r sketch; do
          [ -n "$sketch" ] || continue
          echo "::group::$sketch"
          arduino-cli compile \
            --fqbn "$FQBN" \
            --warnings all \
            --output-dir "build/$(basename "$sketch")" \
            "$sketch" < /dev/null
          echo "::endgroup::"
        done <<< "$SKETCHE"
        ls -lh build/*/
