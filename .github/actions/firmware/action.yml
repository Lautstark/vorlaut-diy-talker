name: Firmware build
description: >
  Richtet arduino-cli mit ESP32-Core und den Adafruit-Bibliotheken ein und
  übersetzt die angegebenen Sketche.

# Why a step of its own instead of the same text twice: CI and release have
# to use the same board setting. An image with a different partition scheme
# boots with black displays - that must not depend on whether someone keeps
# both files in sync.

inputs:
  sketches:
    description: Sketch-Ordner, einer je Zeile.
    required: false
    default: firmware/vorlaut
  fqbn:
    description: Board-Einstellung samt Partitionsschema.
    required: false
    default: esp32:esp32:adafruit_feather_esp32s3_nopsram:PartitionScheme=default_8MB

runs:
  using: composite
  steps:
    - uses: arduino/setup-arduino-cli@v2

    # Deliberately by hand instead of through arduino/compile-sketches: only
    # that way can --output-dir be set and the finished image collected.
    - name: ESP32 core and libraries
      shell: bash
      run: |
        arduino-cli config init --overwrite
        arduino-cli config add board_manager.additional_urls \
          https://espressif.github.io/arduino-esp32/package_esp32_index.json
        arduino-cli core update-index
        arduino-cli core install esp32:esp32
        arduino-cli lib install \
          "Adafruit GFX Library" \
          "Adafruit ST7735 and ST7789 Library"
        arduino-cli core list
        arduino-cli lib list

    - name: Compile
      shell: bash
      env:
        SKETCHES: ${{ inputs.sketches }}
        FQBN: ${{ inputs.fqbn }}
      run: |
        while IFS= read -r sketch; do
          [ -n "$sketch" ] || continue
          echo "::group::$sketch"
          arduino-cli compile \
            --fqbn "$FQBN" \
            --warnings all \
            --output-dir "build/$(basename "$sketch")" \
            "$sketch" < /dev/null
          echo "::endgroup::"
        done <<< "$SKETCHES"
        ls -lh build/*/
