name: Python and build

# Runs only when this job actually has something to check.
#
# firmware/vorlaut/ is deliberately in the list although no sketch is
# compiled here: tests/layout_dump.cpp includes layout_format.h from the
# sketch and compares what the C reader reads with what build.py writes. If
# the format changes in the firmware, this test has to run - otherwise nobody
# notices until the device stays silent.
on:
  push:
    branches: [main]
    paths:
      - '**.py'
      - requirements.txt
      - tests/**
      - example/**
      - firmware/vorlaut/**
      - .github/workflows/ci-python.yml
  pull_request:
    paths:
      - '**.py'
      - requirements.txt
      - tests/**
      - example/**
      - firmware/vorlaut/**
      - .github/workflows/ci-python.yml

jobs:
  python:
    name: Python and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          pip install -r requirements.txt

      # If doctor complains here, the workflow really is missing something -
      # and somebody rebuilding the project is missing it just the same.
      - name: doctor passes
        run: python doctor.py

      - name: Modules import
        run: python -c "import app, build, tts"

      - name: Cross-check layout.bin against the firmware reader
        # Compiles the C code from the sketch on the runner and compares what
        # it reads with what build.py wrote.
        run: python tests/test_layout_format.py

      - name: No German left where English belongs
        # Counts German function words, not umlauts - most German has none.
        # Three files are German on purpose and named in the test.
        run: python tests/test_language.py

      - name: The device sync works end to end
        # Starts the real server and pretends to be a device. The firmware
        # side does not exist yet - this settles the protocol before it does.
        run: python tests/test_device_sync.py

      - name: Writing .env leaves it readable
        # The interface writes this file now. What matters is not that a value
        # arrives but that the comments explaining it survive - .env is its
        # own documentation.
        run: python tests/test_config.py

      - name: The device can find the server
        # The answers the device depends on, over a real socket. The broadcast
        # itself needs a network a runner does not have - that one is stage 7
        # in docs/bring-up.md.
        run: python tests/test_discovery.py

      - name: Pairing works from both sides
        # Starts the real server and plays a pairing through: the device
        # announcing its code, somebody typing it, the key handed over once.
        run: python tests/test_pairing.py

      - name: Interface texts are complete in every language
        # Both languages carry the same keys and the same placeholders, and
        # nothing says words to the user from outside the table.
        run: python tests/test_ui_texts.py

      - name: The pairing format reads the way the device reads it
        # Compiles pair_format.h from the sketch and checks the five-digit
        # code and the line answers against what app.py is supposed to send.
        # Both sides of the pairing are written from docs/software.md, and
        # neither can notice on its own that the other moved.
        run: python tests/test_pair_format.py

      - name: Menu labels fit on a display
        # Compiles texts.h and panel_text.h the same way. A translation that
        # is too long, or uses a letter the built-in font does not have, would
        # otherwise only show once a device is standing on the table.
        run: python tests/test_texts.py

      - name: The example sentences still match their file names
        # example/speech/ is found by fingerprint, and the fingerprint holds
        # the voice configuration. Change the voice and the files stop
        # matching - silently, with four silent keys as the result.
        run: python tests/test_example_speech.py

      - name: Build with the example content
        # Without an Azure key, and with sound all the same: the four example
        # sentences are already spoken and go into the cache, so this is the
        # same path a fresh clone takes on somebody's laptop. --require-audio
        # turns a silent key from a warning into a failure, which is the whole
        # point of the step.
        run: |
          python build.py --require-audio
          test -f firmware/vorlaut/data/layout.bin
          test -f content/layout.json
          test "$(ls firmware/vorlaut/data/a*.wav | wc -l)" -eq 4
