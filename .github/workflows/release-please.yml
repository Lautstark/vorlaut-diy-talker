name: Release the browser half

# What this does, and what it deliberately does not:
#
# release-please watches main for conventional commits, keeps a pull request
# open with the next CHANGELOG.md and version in it, and turns that into a
# tag and a GitHub release when the pull request is merged. Merging it is the
# release.
#
# It versions THE BROWSER HALF ONLY, and tags it "builder-v1.2.0".
#
#   builder-v*     this workflow. It was the editor in src/; after adr/0012
#                  took that to vorlaut-editor, what is left under this prefix
#                  is loader/ - the page that compiles an exported board and
#                  sends it down the cable.
#   v*             release.yml. The firmware image, and nothing else.
#
# The prefix is NOT re-cut to match what it now covers, and that is deliberate
# rather than an oversight. builder-v* has published tags against it, and
# adr/0012's whole safety argument is that no id already out in the world
# changes meaning: the tags stay, the notes stay, and a reader who finds
# builder-v0.1.0 finds the commit it was cut from. Whether this repository
# wants a releasable browser page at all now that it publishes one continuously
# to Pages is a separate question, and an open one - nobody has answered it,
# and answering it by quietly renaming a tag namespace would be the wrong way
# round.
#
# exchange-v* was the third prefix. It was never cut, and exchange/ went to
# vorlaut-editor with the format it specifies; it is that repository's to cut
# now, and the Android viewer's pin is the thing waiting on it.
#
# Two prefixes for two things released on their own schedules out of one
# repository - see adr/0006. docs/releases.md is the long version of all of it,
# including why the firmware's release notes are written by hand and are not to
# be "unified" with these.
#
# Which commits count is decided by PATH, not by the scope in the commit
# message: release-please-config.json excludes firmware/, case/ and device/,
# and a commit that touches one of those AND loader/ still counts for the
# browser half. Scopes depend on somebody remembering; paths do not.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

# One at a time. Two runs racing produce two release pull requests that each
# think they are the only one.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
