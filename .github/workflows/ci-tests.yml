name: Tests

# Runs only when this job actually has something to check.
#
# firmware/vorlaut/ is deliberately in the list although no sketch is compiled
# here: tests/layout_dump.cpp, tests/cable_dump.cpp, tests/texts_dump.cpp and
# tests/device_host.cpp include headers from the sketch and hold what the
# device reads against what the browser writes. If a format changes in the
# firmware, these have to run - otherwise nobody notices until the device
# stays silent.
#
# device/ is here for the other half of the same argument. It holds the
# conformance fixtures both ends are checked against, and both checks run in
# this job: the builder's in `npm test`, the firmware's in `tests/run.py`. A
# fixture that moved without either being re-run would be a specification
# nothing was held to.
#
# docs/ and README.md are in the list for the same kind of reason:
# tests/test_links.py follows every relative link and anchor in them, and a
# link broken by a renamed file or a moved heading is only ever broken by a
# change to those files.
#
# That argument decides the whole prose half of this list, and it reaches
# further than docs/: test_links.py and test_language.py take their file list
# from `git ls-files`, so they check EVERY tracked file, wherever it sits. A
# directory holding tracked prose and missing from this list is a directory
# where a broken link cannot be caught - the job simply does not run. So adr/,
# dns/, case/, voices/ and CLAUDE.md are here too, and the rule for anything
# added later is: if it holds a tracked .md, it belongs in this list.
#
# dns/ earns its place twice over, because dns/verify.py is Python that
# nothing else runs.
#
# The configuration files at the bottom are the exception to that rule and are
# listed for a weaker reason: no test reads them today. They are here so that a
# change to how this repository builds or updates itself is not the one kind of
# change that skips its own test suite. There were two more until adr/0016 -
# release-please-config.json and .release-please-manifest.json - and they went
# with the workflow that read them.
on:
  push:
    branches: [main]
    paths: &paths
      # The page itself, which sits at the repository root because it is the
      # only one - adr/0012. src/** was here beside it until the editor left.
      - index.html
      # Everything the page is made of - the compiler, the tile renderer, the
      # layout.bin writer, the cable, and the reader half of the device
      # package. A change in here reaches tests/run.py as well as the two
      # JavaScript suites, since that is where the tile and cable checks read
      # their modules from.
      - loader/**
      - e2e/**
      - tests/**
      # tools/installcheck.mjs runs ahead of all three suites, so a change to
      # it changes what every one of them is standing on.
      - tools/**
      - public/**
      - example/**
      - firmware/vorlaut/**
      - docs/**
      - device/**
      - adr/**
      - dns/**
      - case/**
      - voices/**
      - README.md
      - CLAUDE.md
      - package.json
      - package-lock.json
      - tsconfig*.json
      - vite.config.ts
      - vitest.config.ts
      - playwright.config.ts
      - renovate.json5
      - .github/workflows/ci-tests.yml
  pull_request:
    paths: *paths

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: npm ci

      - name: The install really is what package.json pins
        # Before any suite, on its own, and it fails rather than warns. A stale
        # node_modules surfaces as a test failing elsewhere with plausible
        # numbers in it - see tools/installcheck.mjs. Distinct from the pins.js
        # step below, which asks the opposite question of the same packages:
        # this one asks whether the install matches the pin, that one whether
        # the pin has fallen behind what upstream has published.
        run: npm run preflight

      - name: Shared packages, and whether anything newer has shipped
        # Warns, never fails: being a patch behind is not a reason to block a
        # deploy that fixes something else. The pin is what stops an install
        # moving the build; this is what stops the pin going quietly stale.
        run: node node_modules/@lautstark/design/pins.js

      # Three toolchains, and each has a reason it cannot be one of the others.
      - name: Types
        run: npm run typecheck

      - name: Unit and frozen references
        # vitest. Imports loader/ directly rather than a build of it, because
        # a frozen reference compared against compiled output has stopped
        # measuring the source it names.
        run: npm test

      - name: Cache the Playwright browser
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install the Playwright browser
        run: npx playwright install --with-deps chromium

      - name: The page, built and opened
        # The one check that runs the front end rather than reading it. This
        # repository once shipped a page that rendered nothing while every
        # other check stayed green.
        run: npm run test:e2e

      - name: What needs a C++ compiler
        # tests/run.py is only this now: compiling the firmware's own readers
        # and replaying the browser's bytes into them, plus the two checks on
        # the repository itself. Python is standard library only.
        #
        # docs/device-interface.md section 5 expects g++ to leave this job once
        # device/fixtures/ exists, and it has not. The reason is that section 5
        # describes CI after a repository split: it moves the C to the firmware
        # side because the firmware side would be a different repository, with
        # a path filter of its own. Inside one repository the same move costs
        # something rather than nothing - ci-firmware.yml runs on firmware/**,
        # so the format checks would stop running on a change to
        # loader/src/layout_format.ts, which is the change that broke a format
        # most recently. Widening that filter instead makes every loader/
        # change pay for the ESP32 core.
        #
        # What did move is the new capability: ci-firmware.yml now compiles the
        # firmware's readers on the host and runs them against the fixture
        # index, so a firmware-only change is checked against the fixtures
        # without depending on this job's path list at all.
        run: python tests/run.py

      - name: g++ really was there
        # tests/run.py skips rather than fails where g++ is missing, so a
        # runner image that quietly dropped it would leave this job green with
        # the firmware's readers never compiled.
        run: g++ --version | head -1
