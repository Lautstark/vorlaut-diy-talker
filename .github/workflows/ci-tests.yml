name: Tests

# Runs only when this job actually has something to check.
#
# firmware/vorlaut/ is deliberately in the list although no sketch is compiled
# here: tests/layout_dump.cpp, tests/cable_dump.cpp and tests/texts_dump.cpp
# include headers from the sketch and hold what the device reads against what
# the browser writes. If a format changes in the firmware, these have to run -
# otherwise nobody notices until the device stays silent.
#
# docs/ and README.md are in the list for the same kind of reason:
# tests/test_links.py follows every relative link and anchor in them, and a
# link broken by a renamed file or a moved heading is only ever broken by a
# change to those files.
on:
  push:
    branches: [main]
    paths:
      - ui.html
      - static/**
      - tests/**
      - example/**
      - firmware/vorlaut/**
      - docs/**
      - README.md
      - .github/workflows/ci-tests.yml
  pull_request:
    paths:
      - ui.html
      - static/**
      - tests/**
      - example/**
      - firmware/vorlaut/**
      - docs/**
      - README.md
      - .github/workflows/ci-tests.yml

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Nothing is installed. Python is here to run tests/run.py, which is
      # standard library only; the checks themselves need node and g++, and
      # the runner image has both. That is not tidiness - it is the state the
      # project ended up in when the Python half was deleted, and a step that
      # quietly installed something would hide how much of this now rests on
      # node alone.

      - name: Tests
        # Every tests/test_*.py, and the folder is the list. This used to be
        # one step per file, written out by hand - which meant a new test was
        # only run if somebody remembered to add it here, and a test nobody
        # added looked exactly like a test that passed.
        #
        # What each test is for is in its own docstring, which is the place
        # that can keep it true. Run one on its own with:
        #   python tests/run.py links
        #
        # Most of them need node: the app is JavaScript now, and so are the
        # checks on it. Three also need a C++ compiler, because they compile
        # the firmware's own readers and replay the browser's bytes into them.
        # Both come with the runner image, so nothing is installed for them.
        run: python tests/run.py

      - name: node and g++ really were there
        # tests/run.py skips rather than fails where node or g++ is missing,
        # so a runner image that quietly dropped one would leave this job
        # green with almost nothing checked. That is the exact failure the
        # frozen references exist to prevent, and it would be absurd to let it
        # in through the workflow instead.
        run: |
          node --version
          g++ --version | head -1
