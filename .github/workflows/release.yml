name: Release

# An artifact on a workflow run expires after 90 days and needs a GitHub
# login to download. For a project meant to be rebuilt that is no good. A
# release stays put and can be downloaded with an ordinary link, without an
# account.
#
#   git tag v0.1  &&  git push origin v0.1
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Publish firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The same board setting as in CI - it is written down in only one
      # Stelle, siehe .github/actions/firmware.
      - uses: ./.github/actions/firmware

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # A device flashed from a release should speak, not show "keine Inhalte"
      # on all five displays. So the example content goes into the image: the
      # same content a fresh install copies into content/, built the same way
      # build.py builds it on a laptop, written into the spiffs partition.
      #
      # No Azure key here and none needed - the four example sentences are
      # already spoken and lie in example/speech/, so the build finds them in
      # the cache instead of rendering them. --require-audio is what keeps
      # that honest: if they ever stop matching, the release stops rather than
      # shipping an image with four silent keys.
      #
      # VORLAUT_CONTENT into the runner's temp folder, not into the checkout:
      # this way ensure_content() really does its first-run copy, which is the
      # thing being shipped, and nothing lands next to the sources.
      - name: Example content into the image
        env:
          VORLAUT_CONTENT: ${{ runner.temp }}/content
        run: |
          pip install -r requirements.txt
          python build.py --require-audio \
            --merge-into build/vorlaut/vorlaut.ino.merged.bin

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          core=$(arduino-cli core list | awk '/^esp32:esp32/ {print $2}')
          # Point at the state of the tag, not at main: a year from now a
          # release should still describe what is actually in it.
          docs="https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}"
          sums=$(cd build/vorlaut && sha256sum vorlaut.ino.merged.bin \
            vorlaut.ino.bin)

          cat > notes.md <<NOTES
          > **This firmware has never run on real hardware.**
          > It compiles cleanly, and nothing beyond that has been checked.
          > Before the first flash, hold the pin assignment against your own
          > boards and work through the
          > [bring-up in stages](${docs}/docs/bring-up.md) - it finds wiring
          > mistakes one at a time instead of all at once.

          ## Flashing

          All you need is \`esptool\`, no Arduino core and no libraries.
          \`vorlaut.ino.merged.bin\` contains the bootloader, the partition
          table, the program **and** the example content, and is written at
          address 0:

          \`\`\`bash
          esptool --chip esp32s3 --port /dev/cu.usbmodemXXXX \\
            write-flash 0x0 vorlaut.ino.merged.bin
          \`\`\`

          \`arduino-cli board list\` finds the port. If esptool reports that
          it cannot find the board: hold **BOOT**, tap **RESET**, release
          **BOOT**.

          After that the device talks: one set with **Ja!**, **Nein!**,
          **Stopp** and **Hilf mir**, the same example that \`content/\` starts
          out with. That is there so the first flash can be checked without
          preparing anything - your own words and pictures are personal and are
          not in the repo. They are produced by \`build.py --fs-image\` from
          your own content and written separately, or fetched by the device
          over Wi-Fi. See [docs/firmware.md](${docs}/docs/firmware.md).

          > **This image is 8 MB and covers the whole flash.** It replaces
          > whatever content is on the device with the example. To update the
          > program of a device that already carries your content, write the
          > app on its own instead:
          >
          > \`\`\`bash
          > esptool --chip esp32s3 --port /dev/cu.usbmodemXXXX \\
          >   write-flash 0x10000 vorlaut.ino.bin
          > \`\`\`

          ## Built from

          Commit \`${GITHUB_SHA}\`, ESP32 core \`${core}\`.

          \`\`\`
          ${sums}
          \`\`\`
          NOTES

          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME - firmware, untested on hardware" \
            --notes-file notes.md \
            --prerelease \
            build/vorlaut/vorlaut.ino.merged.bin \
            build/vorlaut/vorlaut.ino.bin
