name: Release

# An artifact on a workflow run expires after 90 days and needs a GitHub
# login to download. For a project meant to be rebuilt that is no good. A
# release stays put and can be downloaded with an ordinary link, without an
# account.
#
#   git tag v0.1  &&  git push origin v0.1
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Publish firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The same board setting as in CI - it is written down in one place
      # only, see .github/actions/firmware.
      #
      # And the one place a build is named. The tag reaches the sketch as
      # VORLAUT_VERSION, which is what the device answers "firmware v0.4" with
      # over the cable; every other compile - CI, an IDE, a desk - leaves this
      # empty and says "dev" instead. firmware/vorlaut/version.h is why it is
      # taken from the ref rather than kept in a constant somebody bumps.
      - uses: ./.github/actions/firmware
        with:
          version: ${{ github.ref_name }}

      # Program only, and no step here builds content.
      #
      # There used to be one: build.py rendered the four example sentences and
      # merged them into the file area, so a device flashed from a release
      # spoke as soon as it started. That was worth having and it is not
      # coming back this way - build.py went with the Python, the build runs
      # in a browser now, and a workflow cannot press a button in one.
      #
      # What replaces it is that the file area no longer has to arrive with
      # the program. The image leaves it erased, the firmware formats it on
      # first boot, and content is one press in the editor away over the
      # cable. So the release is the program, and the device says "no content"
      # until somebody sends some - which is a true sentence about a talker
      # nobody has filled in yet.

      # The one failure this arrangement can have quietly. A build property
      # that did not reach the compiler - a quoting rule that changed, a
      # property name the core stopped honouring - does not fail the compile:
      # version.h's #ifndef stands, and the image is published claiming to be
      # `dev`. So the tag is looked for in the bytes that are about to be
      # uploaded, which is the same check that established the flag works at
      # all.
      - name: The image really carries the tag
        run: |
          if ! grep -q -- "$GITHUB_REF_NAME" build/vorlaut/vorlaut.ino.bin; then
            echo "::error::the build does not contain $GITHUB_REF_NAME - the" \
                 "version was not compiled in, and the device would answer" \
                 "'firmware dev'"
            exit 1
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          core=$(arduino-cli core list | awk '/^esp32:esp32/ {print $2}')
          # Point at the state of the tag, not at main: a year from now a
          # release should still describe what is actually in it.
          docs="https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}"
          sums=$(cd build/vorlaut && sha256sum vorlaut.ino.merged.bin \
            vorlaut.ino.bin)

          cat > notes.md <<NOTES
          > **This firmware has run on real hardware** - flashed, fed a board
          > over the cable and heard, first on 2026-08-27 - but on one talker,
          > built by the person who wrote it.
          > Before the first flash, hold the pin assignment against your own
          > boards and work through the
          > [bring-up in stages](${docs}/docs/bring-up.md) - it finds wiring
          > mistakes one at a time instead of all at once.

          ## Flashing

          All you need is \`esptool\`, no Arduino core and no libraries.
          \`vorlaut.ino.merged.bin\` contains the bootloader, the partition
          table and the program, and is written at address 0:

          \`\`\`bash
          esptool --chip esp32s3 --port /dev/cu.usbmodemXXXX \\
            write-flash 0x0 vorlaut.ino.merged.bin
          \`\`\`

          \`arduino-cli board list\` finds the port. If esptool reports that
          it cannot find the board: hold **BOOT**, tap **RESET**, release
          **BOOT**.

          **The device comes up empty**, with *no content* on all five
          displays. That is correct and not a fault: this image carries no
          words or pictures, because yours are personal and are not in this
          repository. It formats its own file area on the first start, and
          content arrives afterwards from the editor, down the USB-C cable, in
          one press - see [docs/cable.md](${docs}/docs/cable.md).

          Earlier releases carried four example sentences so that a first
          flash could be checked on its own. That went with the Python build:
          the build runs in a browser now, and a workflow cannot press a
          button in one. What the first flash still shows without any content
          is whether the displays, the partition scheme and the file system
          are right - **Info** in the menu says whether the file system
          mounted, and the two menu keys respond either way.

          > **This image is 8 MB and covers the whole flash.** It erases
          > whatever content is on the device. To update the program of a
          > device that already carries yours, write the app on its own
          > instead:
          >
          > \`\`\`bash
          > esptool --chip esp32s3 --port /dev/cu.usbmodemXXXX \\
          >   write-flash 0x10000 vorlaut.ino.bin
          > \`\`\`

          ## Which build a device says it is carrying

          This image answers \`firmware ${GITHUB_REF_NAME}\` when the loader
          page greets it, and the page writes that into its log. A talker
          flashed before 2026-08-28 says nothing there, which is not a fault -
          the line did not exist yet. Nothing compares two of these words yet;
          what the greeting gives is a name for the build in front of you.

          ## Built from

          Commit \`${GITHUB_SHA}\`, ESP32 core \`${core}\`.

          \`\`\`
          ${sums}
          \`\`\`
          NOTES

          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME - firmware, run on one talker" \
            --notes-file notes.md \
            --prerelease \
            build/vorlaut/vorlaut.ino.merged.bin \
            build/vorlaut/vorlaut.ino.bin
