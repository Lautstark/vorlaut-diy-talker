name: Release

# An artifact on a workflow run expires after 90 days and needs a GitHub
# login to download. For a project meant to be rebuilt that is no good. A
# release stays put and can be downloaded with an ordinary link, without an
# account.
#
#   git tag v0.1  &&  git push origin v0.1
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Publish firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The same board setting as in CI - it is written down in only one
      # Stelle, siehe .github/actions/firmware.
      - uses: ./.github/actions/firmware

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          kern=$(arduino-cli core list | awk '/^esp32:esp32/ {print $2}')
          # Point at the state of the tag, not at main: a release should
          # still describe, a year from now, what
          # was in ihr steckt.
          doku="https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}"
          summen=$(cd build/vorlaut && sha256sum vorlaut.ino.merged.bin \
            vorlaut.ino.bin)

          cat > hinweise.md <<HINWEISE
          > **Diese Firmware ist noch nie auf echter Hardware gelaufen.**
          > Sie übersetzt sauber, mehr ist bisher nicht geprüft. Vor dem ersten
          > Flashen die Pinbelegung gegen die eigenen Boards halten und die
          > [Inbetriebnahme in Stufen](${doku}/docs/bring-up.md) durchgehen -
          > sie findet Verdrahtungsfehler einzeln statt alle auf einmal.

          ## Aufspielen

          Es braucht nur \`esptool\`, keinen Arduino-Core und keine
          Bibliotheken. \`vorlaut.ino.merged.bin\` enthält Bootloader,
          Partitionstabelle und Programm und wird an Adresse 0 geschrieben:

          \`\`\`bash
          esptool --chip esp32s3 --port /dev/cu.usbmodemXXXX \\
            write-flash 0x0 vorlaut.ino.merged.bin
          \`\`\`

          Den Port findet \`arduino-cli board list\`. Meldet esptool, dass es
          das Board nicht findet: **BOOT** halten, kurz **RESET** tippen,
          **BOOT** loslassen.

          Das ist nur das Programm. Bilder und Töne sind persönlich und liegen
          nicht im Repo - die entstehen mit \`build.py --fs-image\` aus den
          eigenen Inhalten und werden getrennt geschrieben, siehe
          [docs/firmware.md](${doku}/docs/firmware.md).

          ## Gebaut aus

          Commit \`${GITHUB_SHA}\`, ESP32-Core \`${kern}\`.

          \`\`\`
          ${summen}
          \`\`\`
          HINWEISE

          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME - Firmware, auf Hardware ungetestet" \
            --notes-file hinweise.md \
            --prerelease \
            build/vorlaut/vorlaut.ino.merged.bin \
            build/vorlaut/vorlaut.ino.bin
