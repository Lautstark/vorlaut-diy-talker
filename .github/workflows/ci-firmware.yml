name: Firmware build

# Only on changes to the firmware itself - the ESP32 core takes close to a
# minute to install, and a documentation change should not have to pay for it.
on:
  push:
    branches: [main]
    paths:
      - firmware/**
      - .github/actions/firmware/**
      - .github/workflows/ci-firmware.yml
  pull_request:
    paths:
      - firmware/**
      - .github/actions/firmware/**
      - .github/workflows/ci-firmware.yml

jobs:
  firmware:
    name: Firmware build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The test sketches come along: they use the same pins.h as the real
      # firmware. Whoever does not compile them too notices a broken pins.h
      # only once someone is sitting there with a soldering iron.
      - uses: ./.github/actions/firmware
        with:
          sketches: |
            firmware/vorlaut
            firmware/tests/test1_board
            firmware/tests/test2_display
            firmware/tests/test3_displays
            firmware/tests/test4_buttons
            firmware/tests/test5_sound

      # Ready-made image, so nobody has to install Arduino just to flash.
      # merged.bin contains bootloader, partition table and program and gets
      # written at address 0. The file area inside it is left erased and the
      # firmware formats it on the first start; content arrives afterwards
      # from the editor, over the cable.
      #
      # The release is the same thing. It used to merge the example content in
      # so that a first flash spoke, and that went with the Python build - so
      # the two images no longer differ at all, and this comment no longer has
      # a difference to explain.
      #
      # Artifacts expire after 90 days and need a login. Whoever only wants
      # to flash is better off with the release for the tag - see
      # release.yml.
      - name: Upload firmware image
        uses: actions/upload-artifact@v7
        with:
          name: firmware
          path: |
            build/vorlaut/vorlaut.ino.merged.bin
            build/vorlaut/vorlaut.ino.bin
          if-no-files-found: error
