name: Firmware build

# Only on changes to the firmware itself - the ESP32 core takes close to a
# minute to install, and a documentation change should not have to pay for it.
#
# device/ is in the list although no sketch depends on it, and it is worth
# being explicit about the cost: a change under device/ now pays for the ESP32
# core as well as for the host job below. That is deliberate. device/ holds
# the conformance fixtures the firmware's own readers are checked against, so
# a change there is a change to what the device is required to accept - which
# is exactly the kind of change that should compile the thing that has to
# accept it.
on:
  push:
    branches: [main]
    paths: &paths
      - firmware/**
      - device/**
      - tests/device_host.cpp
      - tests/test_device_host.py
      - .github/actions/firmware/**
      - .github/workflows/ci-firmware.yml
  pull_request:
    paths: *paths

jobs:
  # A host job, which this workflow did not have. It is a new capability
  # rather than a detail, and it is the honest cost of giving the device
  # interface a specification of its own: until now this workflow only ever
  # compiled FOR the target, and nothing here could ask the firmware's readers
  # a question. docs/device-interface.md section 5 asks for exactly this.
  #
  # Deliberately first and deliberately cheap. It needs g++ and Python and
  # nothing else - no ESP32 core, no node - so a format broken in a header
  # fails in well under a minute rather than after the toolchain install.
  #
  # It does not replace anything. tests/test_layout_frozen.py and
  # tests/test_cable_format.py still hold the two implementations against each
  # other on the same run over in ci-tests.yml, which is a stronger statement
  # than either end can make against a fixture. This is the check that would
  # survive the two halves ever being separated, and the one that reaches the
  # refusal branches no capture of a correct writer can contain.
  readers:
    name: The firmware's readers, on the host
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Against device/fixtures
        run: python tests/test_device_host.py

      - name: g++ really was there
        # tests/test_device_host.py skips rather than fails where no compiler
        # is found, so a runner image that quietly dropped it would leave this
        # job green with nothing compiled at all. The same guard ci-tests.yml
        # has, for the same reason.
        run: g++ --version | head -1

  firmware:
    name: Firmware build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The test sketches come along: they use the same pins.h as the real
      # firmware. Whoever does not compile them too notices a broken pins.h
      # only once someone is sitting there with a soldering iron.
      - uses: ./.github/actions/firmware
        with:
          sketches: |
            firmware/vorlaut
            firmware/tests/test1_board
            firmware/tests/test2_display
            firmware/tests/test3_displays
            firmware/tests/test4_buttons
            firmware/tests/test5_sound

      # Ready-made image, so nobody has to install Arduino just to flash.
      # merged.bin contains bootloader, partition table and program and gets
      # written at address 0. The file area inside it is left erased and the
      # firmware formats it on the first start; content arrives afterwards
      # from the editor, over the cable.
      #
      # The release is the same thing. It used to merge the example content in
      # so that a first flash spoke, and that went with the Python build - so
      # the two images no longer differ at all, and this comment no longer has
      # a difference to explain.
      #
      # Artifacts expire after 90 days and need a login. Whoever only wants
      # to flash is better off with the release for the tag - see
      # release.yml.
      - name: Upload firmware image
        uses: actions/upload-artifact@v7
        with:
          name: firmware
          path: |
            build/vorlaut/vorlaut.ino.merged.bin
            build/vorlaut/vorlaut.ino.bin
          if-no-files-found: error
