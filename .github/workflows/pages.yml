name: Deploy the board designer to GitHub Pages

# The shape is bildhaft's deploy.yml, which solved the same problem first: test,
# then build, then deploy, with pull requests tested and never published. The
# toolchain is now the same shape too - Vite and TypeScript - though without
# React, because vorlaut's interface is plain DOM and there is nothing here
# asking to be a component tree.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more. Cancelling a deploy half
# way leaves Pages serving whatever it had got to.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Nothing reaches Pages unless this passes. Three toolchains, because the
  # checks genuinely need three: vitest imports src/ directly, Playwright opens
  # the built page in a browser, and tests/run.py compiles the firmware's own
  # C++ readers to replay the browser's bytes into them.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: npm ci

      - name: Shared packages, and whether anything newer has shipped
        # Warns, never fails: being a patch behind is not a reason to block a
        # deploy that fixes something else. The pin is what stops an install
        # moving the build; this is what stops the pin going quietly stale.
        run: node node_modules/@lautstark/design/pins.js

      - name: Types
        run: npm run typecheck

      - name: Unit and frozen references
        run: npm test

      - name: Cache the Playwright browser
        id: browser
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install the Playwright browser
        run: npx playwright install --with-deps chromium

      - name: The page, built and opened
        run: npm run test:e2e

      - name: What needs a C++ compiler
        # g++ comes with the runner image, so nothing is installed for it.
        run: python tests/run.py

      - name: g++ really was there
        # tests/run.py skips rather than fails where g++ is missing, so a runner
        # image that quietly dropped it would leave this gate green with the
        # firmware's own readers never compiled - which is the whole of what
        # that file is for now.
        run: g++ --version | head -1

  build:
    needs: test
    # Pull requests are tested but never published.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      - name: Build
        # A project site is served from /<repo>/, so the bundle needs that base.
        # For a user site (<user>.github.io) set BASE_PATH to "/" instead.
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
