name: Deploy the loader page to GitHub Pages

# The shape is bildhaft's deploy.yml, which solved the same problem first: test,
# then build, then deploy, with pull requests tested and never published. The
# toolchain is now the same shape too - Vite and TypeScript - though without
# React, because this interface is plain DOM and there is nothing here asking
# to be a component tree.
#
# What is published is one page: loader/, which takes a board exported from
# vorlaut-editor and sends it to a talker down a USB-C cable. It was published
# at <base>loader/ beside the editor until adr/0012, and took the root when the
# editor left. Since the move to talker.lautstark.tech the address no longer
# contains a repository name at all, which is the point: the page somebody
# opens with a cable in their hand can now survive the repository moving.
# lautstark.github.io/vorlaut-diy-talker/ redirects there, so nothing anybody
# bookmarked before is lost.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more. Cancelling a deploy half
# way leaves Pages serving whatever it had got to.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Nothing reaches Pages unless this passes. Three toolchains, because the
  # checks genuinely need three: vitest imports loader/ directly, Playwright
  # opens the built page in a browser, and tests/run.py compiles the firmware's
  # own C++ readers to replay the browser's bytes into them.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: npm ci

      - name: The install really is what package.json pins
        # Before any suite, on its own, and it fails rather than warns. A stale
        # node_modules surfaces as a test failing elsewhere with plausible
        # numbers in it - see tools/installcheck.mjs. Distinct from the pins.js
        # step below, which asks the opposite question of the same packages:
        # this one asks whether the install matches the pin, that one whether
        # the pin has fallen behind what upstream has published.
        run: npm run preflight

      - name: Shared packages, and whether anything newer has shipped
        # Warns, never fails: being a patch behind is not a reason to block a
        # deploy that fixes something else. The pin is what stops an install
        # moving the build; this is what stops the pin going quietly stale.
        run: node node_modules/@lautstark/design/pins.js

      - name: Types
        run: npm run typecheck

      - name: Unit and frozen references
        run: npm test

      - name: Cache the Playwright browser
        id: browser
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install the Playwright browser
        run: npx playwright install --with-deps chromium

      - name: The page, built and opened
        run: npm run test:e2e

      - name: What needs a C++ compiler
        # g++ comes with the runner image, so nothing is installed for it.
        run: python tests/run.py

      - name: g++ really was there
        # tests/run.py skips rather than fails where g++ is missing, so a runner
        # image that quietly dropped it would leave this gate green with the
        # firmware's own readers never compiled - which is the whole of what
        # that file is for now.
        run: g++ --version | head -1

  build:
    needs: test
    # Pull requests are tested but never published.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      - name: The install really is what package.json pins
        # This job installs afresh, so it is the lockfile disagreeing with
        # package.json that would fire here rather than a stale node_modules.
        # Cheap, and this is the job whose output people actually receive.
        run: npm run preflight

      - name: Build
        # Served from a subdomain of lautstark.tech, so the bundle sits at the
        # root rather than under /<repo>/. The CNAME file in public/ is what
        # holds that domain across deploys: GitHub reads it out of the
        # published artifact, and a deploy without it drops the domain.
        env:
          BASE_PATH: /
        run: npm run build

      # The firmware the deployed page offers to write, from the newest v*
      # release. adr/0017 is why it is here rather than fetched by the browser:
      # the page makes no cross-origin request, so the image has to be an asset
      # of this deploy. With no release cut - which is this repository today -
      # it writes a manifest saying so and the page's firmware section is
      # absent rather than broken.
      - name: The firmware the page carries
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/firmware_for_pages.mjs dist

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
