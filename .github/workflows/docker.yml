name: Container image

on:
  push:
    branches: [main]
    # Deliberately no paths filter any more. There used to be one - Dockerfile
    # and requirements.txt - and it was right while docker-compose.yml mounted
    # the project over /app: the image held the runtime, the folder held the
    # code, and a changed app.py reached a container without a new image.
    #
    # That mount is gone. The code in the image is now the code that runs, so
    # every change to main changes what a "docker compose pull" fetches, and a
    # filter would leave people running whatever was current the last time the
    # Dockerfile happened to change.
    tags: ['v*']

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Written out rather than worked out from ${{ github.repository }},
      # which is where it used to come from. The repository is moving to
      # another owner, and the image name would have followed it: the workflow
      # would have begun publishing under a new path while the README,
      # docker-compose.yml and the install line in docs/operation.md all still
      # named the old one. Nobody would have seen an error. They would simply
      # have gone on pulling a tag that had quietly stopped moving.
      #
      # It stays written out until the browser version replaces the container,
      # at which point this workflow is deleted rather than corrected. Lower
      # case throughout because Docker tags have to be and user names do not.
      - name: Name the image
        run: |
          echo "ABBILD=ghcr.io/steffipetaffy/vorlaut" >> "$GITHUB_ENV"

      # What the image is called, worked out from what was pushed. Only
      # :latest used to be published, which meant there was nothing to pin to
      # and nothing to go back to - and now that the image carries the code,
      # that is the whole question of which version is running.
      #
      # A tag v0.2 gives :0.2 and :0.2.0 - release.yml already builds the
      # firmware from the same tags, so the image and the device that talks to
      # it carry the same number. A push to main gives :sha-abc1234, because
      # between two releases the commit is the only thing there is to name.
      # :latest moves either way; it is what docker-compose.yml asks for.
      #
      # The labels come along for the same reason: "docker inspect" then says
      # which commit an image was built from, without having to work it out
      # from a tag.
      - name: Work out the tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.ABBILD }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest

      # amd64 and arm64, so that NAS models with ARM can pull it too,
      # rather than having to build it themselves.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
