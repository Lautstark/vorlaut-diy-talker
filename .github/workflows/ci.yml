name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python und Bauvorgang
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          pip install -r requirements.txt

      # Wenn doctor hier meckert, fehlt dem Ablauf wirklich etwas - und
      # dann fehlt es einem Nachbauer genauso.
      - name: doctor läuft durch
        run: python doctor.py

      - name: Module importierbar
        run: python -c "import app, build, tts"

      - name: layout.bin gegen den Firmware-Leser prüfen
        # Übersetzt den C-Code aus dem Sketch auf dem Runner und vergleicht,
        # was er liest, mit dem was build.py geschrieben hat.
        run: python tests/test_layout_format.py

      - name: Bauvorgang mit den Beispielinhalten
        # Ohne Azure-Schlüssel: Bilder und layout.h entstehen, Ton nicht.
        # Prüft, dass content/ sich aus example/ füllt und alles durchläuft.
        run: |
          python build.py --no-audio
          test -f firmware/mitreden/data/layout.bin
          test -f content/layout.json

  firmware:
    name: Firmware übersetzen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2

      # Bewusst von Hand statt über arduino/compile-sketches: nur so lässt
      # sich --output-dir setzen und das fertige Abbild einsammeln.
      - name: ESP32-Core und Bibliotheken
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls \
            https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          arduino-cli lib install \
            "Adafruit GFX Library" \
            "Adafruit ST7735 and ST7789 Library"

      - name: Übersetzen
        run: |
          arduino-cli compile \
            --fqbn esp32:esp32:adafruit_feather_esp32s3_nopsram:PartitionScheme=default_8MB \
            --warnings all \
            --output-dir build \
            firmware/mitreden
          ls -lh build

      # Fertiges Abbild, damit niemand Arduino installieren muss, um zu
      # flashen. merged.bin enthält Bootloader, Partitionstabelle und
      # Programm und wird an Adresse 0 geschrieben. Die Inhalte kommen
      # getrennt dazu.
      - name: Firmware-Abbild sichern
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            build/mitreden.ino.merged.bin
            build/mitreden.ino.bin
          if-no-files-found: error
