name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python und Bauvorgang
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten
        run: pip install -r requirements.txt

      - name: Module importierbar
        run: python -c "import app, build, tts"

      - name: layout.bin gegen den Firmware-Leser prüfen
        # Übersetzt den C-Code aus dem Sketch auf dem Runner und vergleicht,
        # was er liest, mit dem was build.py geschrieben hat.
        run: python tests/test_layout_format.py

      - name: Bauvorgang mit den Beispielinhalten
        # Ohne Azure-Schlüssel: Bilder und layout.h entstehen, Ton nicht.
        # Prüft, dass content/ sich aus example/ füllt und alles durchläuft.
        run: |
          python build.py --no-audio
          test -f firmware/mitreden/data/layout.bin
          test -f content/layout.json

  firmware:
    name: Firmware übersetzen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Der Sketch braucht keine erzeugten Dateien mehr - die Tabelle liegt
      # zur Laufzeit auf dem Dateisystem des Geräts.
      - name: Übersetzen
        uses: arduino/compile-sketches@v1
        with:
          fqbn: "esp32:esp32:adafruit_feather_esp32s3_nopsram:PartitionScheme=default_8MB"
          platforms: |
            - source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
              name: esp32:esp32
          libraries: |
            - name: Adafruit GFX Library
            - name: Adafruit ST7735 and ST7789 Library
          sketch-paths: |
            - firmware/mitreden
          enable-warnings-report: true
          cli-compile-flags: |
            - --output-dir
            - ./build

      # Fertig geflashte Datei, damit niemand Arduino installieren muss.
      # merged.bin enthält Bootloader, Partitionstabelle und Programm und
      # wird an Adresse 0 geschrieben. Die Inhalte kommen getrennt dazu.
      - name: Firmware-Abbild sichern
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            build/mitreden.ino.merged.bin
            build/mitreden.ino.bin
          if-no-files-found: error
