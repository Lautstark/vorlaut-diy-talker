# Wokwi simulator, started from VS Code: F1 > "Wokwi: Start Simulator".
#
# The extension looks for this file in the root of the opened folder, which is
# why it sits here and not next to the sketch.
#
# What it is good for: Wi-Fi, the file system and the sync with the web
# interface can be checked here before the hardware arrives - and afterwards
# too, because otherwise that needs device, network and server all at once.
# The VS Code extension brings a gateway through which the simulated ESP32
# reaches the local network, and with it the server on this machine.
#
#
# WHAT DOES NOT WORK HERE: the displays.
#
# Wokwi has no built-in ST7735. The community chip
# github:martysweet/st7735-wokwi-chip does announce itself ("Driver Chip
# Initialized! W=128, H=160") but draws nothing - neither with
# INITR_144GREENTAB (our 128x128 panels) nor with INITR_BLACKTAB, which its
# own documentation says it was tested with. Both tried on 2026-08-21, and in
# both cases the area stayed black while the sketch demonstrably ran through.
#
# So diagram.json holds nothing but the board and the serial connection.
# Whether the symbols look right is settled by the real hardware with
# firmware/tests/test2_display and test3_displays - that is what the stages
# are for.
#
#
# TWO THINGS WORTH KNOWING
#
# 1. Compile with CDCOnBoot=default. The board defaults to "USB CDC On Boot",
#    and then Serial goes over USB - while Wokwi's serial monitor hangs off
#    UART0 (TX/RX). Without this option the monitor stays silent although the
#    sketch is running. On the real hardware it stays at CDC, as described in
#    docs/firmware.md.
#
# 2. After a change to diagram.json, stop the simulator completely (the stop
#    button) and start it again. The green restart button only reloads the
#    firmware, not the diagram - otherwise you run into a boot loop, because
#    the simulated flash is still at the default 4 MB while our partition
#    table needs 8 MB.
#
#
# Which sketch gets simulated is set by the two paths below:
#
#   arduino-cli compile \
#     --fqbn "esp32:esp32:adafruit_feather_esp32s3_nopsram:PartitionScheme=default_8MB,CDCOnBoot=default" \
#     --output-dir firmware/tests/test2_display/build \
#     firmware/tests/test2_display

[wokwi]
version = 1
firmware = 'firmware/tests/test2_display/build/test2_display.ino.merged.bin'
elf = 'firmware/tests/test2_display/build/test2_display.ino.elf'
